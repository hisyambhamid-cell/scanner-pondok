<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-SECURE Scanner</title>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<style>
body{margin:0;font-family:Arial;background:#020617;color:white;text-align:center;padding:16px}
h2{margin:10px 0 4px}
.sub{color:#93c5fd;font-weight:bold;margin-bottom:12px}
video{width:96%;max-width:520px;margin-top:14px;border-radius:16px;border:3px solid #38bdf8}
button{margin:8px;padding:16px 22px;border:0;border-radius:14px;font-size:16px;font-weight:900}
.out{background:#22c55e;color:#052e16}
.in{background:#f59e0b;color:#451a03}
#result{margin-top:14px;padding:14px;border-radius:14px;background:#111827;font-size:18px;font-weight:900;white-space:pre-line}
</style>
</head>
<body>

<h2>E-SECURE SCANNER</h2>
<div class="sub">MRSM BETONG • Barcode Mode</div>

<button class="out" onclick="startScan('KELUAR')">SCAN KELUAR</button>
<button class="in" onclick="startScan('MASUK')">SCAN MASUK</button>

<video id="video" muted playsinline></video>
<div id="result">Sedia untuk scan.</div>

<script>
let busy = false;
let controls = null;
let mode = "KELUAR";

async function startScan(jenis){
  mode = jenis;
  busy = false;
  document.getElementById("result").innerText =
    "Kamera dibuka...\nFokus pada barcode bawah kad sahaja.";

  try{
    if(controls){ controls.stop(); controls = null; }

    const reader = new ZXingBrowser.BrowserMultiFormatReader();
    const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

    let deviceId = undefined;
    if(devices && devices.length){
      const back = devices.find(d => /back|rear|environment/i.test(d.label || ""));
      deviceId = back ? back.deviceId : devices[devices.length - 1].deviceId;
    }

    controls = await reader.decodeFromVideoDevice(deviceId, "video", (result, err)=>{
      if(!result || busy) return;
      busy = true;

      let code = String(result.getText() || "").trim().toUpperCase();
      const m = code.match(/ST\d+/);
      if(m) code = m[0];

      document.getElementById("result").innerText =
        "✅ SCAN BERJAYA\nNO MAKTAB: " + code + "\nMODE: " + mode;

      beep();
      setTimeout(()=>{ busy = false; },1500);
    });

  }catch(e){
    document.getElementById("result").innerText =
      "❌ Kamera gagal dibuka.\n" + (e.message || e);
  }
}

function beep(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = 1200;
  osc.connect(gain);
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(.6, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .14);
  osc.start();
  osc.stop(ctx.currentTime + .14);
}
</script>
</body>
</html>
