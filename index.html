<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-SECURE Barcode Scanner</title>
<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>
<style>
body{margin:0;background:#020617;color:white;font-family:Arial;text-align:center;padding:16px}
h2{margin:10px 0}
button{padding:15px 22px;margin:8px;border:0;border-radius:14px;font-weight:900;font-size:16px}
.out{background:#22c55e;color:#052e16}
.in{background:#f59e0b;color:#451a03}
#reader{width:96%;max-width:520px;height:300px;margin:15px auto;border:3px solid #38bdf8;border-radius:16px;overflow:hidden}
#result{background:#111827;padding:14px;border-radius:14px;font-weight:900;white-space:pre-line}
</style>
</head>
<body>

<h2>E-SECURE SCANNER</h2>
<div>MRSM BETONG • Barcode Mode</div>

<button class="out" onclick="startScan('KELUAR')">SCAN KELUAR</button>
<button class="in" onclick="startScan('MASUK')">SCAN MASUK</button>

<div id="reader"></div>
<div id="result">Sedia untuk scan.</div>

<script>
let mode = "KELUAR";
let busy = false;

function startScan(jenis){
  mode = jenis;
  busy = false;
  document.getElementById("result").innerText = "Kamera dibuka... fokus pada barcode.";

  Quagga.stop();

  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: document.querySelector("#reader"),
      constraints: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    },
    locator: {
      patchSize: "medium",
      halfSample: false
    },
    numOfWorkers: 2,
    frequency: 10,
    decoder: {
      readers: [
        "code_128_reader",
        "code_39_reader",
        "ean_reader",
        "ean_8_reader"
      ],
      multiple: false
    },
    locate: true
  }, function(err){
    if(err){
      document.getElementById("result").innerText = "❌ Kamera gagal:\n" + err;
      return;
    }
    Quagga.start();
  });
}

Quagga.onDetected(function(data){
  if(busy) return;

  let code = data && data.codeResult && data.codeResult.code
    ? String(data.codeResult.code).trim().toUpperCase()
    : "";

  if(!code) return;

  const m = code.match(/ST\d+/);
  if(m) code = m[0];

  busy = true;

  document.getElementById("result").innerText =
    "✅ SCAN BERJAYA\nNO MAKTAB: " + code + "\nMODE: " + mode;

  beep();

  setTimeout(()=>{ busy = false; },1500);
});

function beep(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = 1200;
  osc.connect(gain);
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(.6, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .14);
  osc.start();
  osc.stop(ctx.currentTime + .14);
}
</script>

</body>
</html>
